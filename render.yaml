web: gunicorn app:app --host 0.0.0.0 --port $PORT
worker: python -c "pass"
render: |
  services:
    - type: web
      name: aetheron-live-trading
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: gunicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout 120
      plan: starter
      healthCheckPath: /api/state